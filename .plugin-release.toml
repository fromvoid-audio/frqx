schema = 1
name = "Freqs"
package = "freqs"
library = "freqs"

[[variants]]
name = "Freqs"
slug = "freqs"
archive_slug = "Freqs"
bundle_id = "com.portalsurfer.freqs.vst3"
features = ["vst3"]
gumroad_product = "UDsnz1eApMbEzWBvwU6I-Q=="
# Donationware needs no licensing hook.

[variants.instructions]
macos-arm64 = "release/INSTALL-MACOS.txt"
macos-x64 = "release/INSTALL-MACOS.txt"
[variants.extra_files]
macos-arm64 = ["dist/release-extras/ODDSound-libMTS-1.03.pkg", "CHANGELOG.md"]
macos-x64 = ["dist/release-extras/ODDSound-libMTS-1.03.pkg", "CHANGELOG.md"]

[signing]
identity = "Developer ID Application: Wanja Svasek (DKTKQ8U5T8)"
profile = "freqs-notary"
identity_env = "APPLE_CODESIGN_IDENTITY"
profile_env = "APPLE_NOTARY_KEYCHAIN_PROFILE"

[[hooks.checks]]
argv = ["bash", "scripts/ci.sh", "--vst3"]
platforms = ["macos-arm64", "macos-x64"]

[[hooks.before_package]]
argv = ["bash", "scripts/prepare-release-extras.sh"]
platforms = ["macos-arm64", "macos-x64"]

[[hooks.inspect_binary]]
argv = ["python3", "scripts/inspect-binary.py"]
platforms = ["macos-arm64", "macos-x64"]
